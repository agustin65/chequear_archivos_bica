<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chequeo Débitos BICA</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#667085; --border:#d9dde3;
          --ok:#0f7b3f; --okbg:#e6f6ec; --bad:#b42318; --badbg:#fdecea; --accent:#2f5bd3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171c; --card:#1d2128; --text:#e7e9ee; --muted:#9aa3b2; --border:#333a45;
            --ok:#5fd394; --okbg:#173325; --bad:#ff8a80; --badbg:#3a1d1b; --accent:#7ea0ff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:820px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.5rem; margin:0 0 8px; }
  p.sub { color:var(--muted); margin:0 0 28px; line-height:1.5; }
  #drop { display:block; border:2px dashed var(--border); border-radius:12px; padding:40px 16px; text-align:center;
          background:var(--card); cursor:pointer; transition:border-color .15s; }
  #drop.over { border-color:var(--accent); }
  #drop strong { color:var(--accent); }
  input[type=file] { display:none; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; margin-top:20px; }
  .actions { display:flex; justify-content:flex-end; margin-top:20px; }
  .actions[hidden] { display:none; }
  button { font:inherit; padding:8px 16px; border-radius:8px; border:1px solid var(--border);
           background:var(--card); color:var(--text); cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  .card h2 { font-size:1.05rem; margin:0 0 12px; word-break:break-all; }
  .verdict { padding:10px 12px; border-radius:8px; font-weight:600; margin-bottom:12px; }
  .verdict.ok { background:var(--okbg); color:var(--ok); }
  .verdict.bad { background:var(--badbg); color:var(--bad); }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:500; font-size:.85rem; }
  td.num { text-align:right; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  ul.issues { margin:12px 0 0; padding-left:20px; color:var(--bad); }
  .meta { color:var(--muted); font-size:.85rem; margin-top:8px; }
</style>
</head>
<body>
<main>
  <h1>Chequeo de Débitos BICA Ágil</h1>
  <p class="sub">Verifica que la cantidad de débitos y el monto total coincidan con el encabezado del archivo. El archivo no sale de tu computadora: se procesa en el navegador.</p>

  <label id="drop" for="file">
    Arrastrá uno o más archivos <strong>.csv</strong> acá, o hacé clic para elegirlos.
  </label>
  <input id="file" type="file" accept=".csv,.txt,text/csv" multiple>

  <div class="actions" id="actions" hidden><button type="button" id="reset">Reiniciar</button></div>
  <div id="results"></div>
</main>

<script>
// Formato esperado (separado por ";"):
//   H;<id>;<fecha>;<monto total>;<cantidad de débitos>;
//   D;<...>;<cbu>;<monto>;<fecha vto>;;;<referencia>;

const fmt = new Intl.NumberFormat('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = cents => '$ ' + fmt.format(cents / 100);

// Convierte "1234.56" a centavos enteros para evitar errores de redondeo.
function toCents(str) {
  const s = String(str).trim().replace(/"/g, '');
  const m = s.match(/^(-?)(\d+)(?:\.(\d{1,2}))?$/);
  if (!m) return null;
  const cents = parseInt(m[2], 10) * 100 + parseInt((m[3] || '0').padEnd(2, '0'), 10);
  return m[1] ? -cents : cents;
}

function check(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
  const issues = [];
  let header = null, count = 0, sum = 0;

  lines.forEach((line, i) => {
    const f = line.split(';');
    const type = f[0].trim().toUpperCase();
    if (type === 'H') {
      if (header) issues.push(`Línea ${i + 1}: hay más de un encabezado (H).`);
      else header = { line: i + 1, id: f[1], date: f[2], total: toCents(f[3]), count: parseInt(f[4], 10) };
    } else if (type === 'D') {
      const c = toCents(f[3]);
      if (c === null) issues.push(`Línea ${i + 1}: monto inválido "${f[3]}".`);
      else { sum += c; count++; }
    } else {
      issues.push(`Línea ${i + 1}: tipo de registro desconocido "${f[0]}".`);
    }
  });

  if (!header) issues.push('No se encontró el encabezado (línea que empieza con H).');
  else {
    if (header.total === null) issues.push('El monto total del encabezado no es válido.');
    if (isNaN(header.count)) issues.push('La cantidad del encabezado no es válida.');
  }
  return { header, count, sum, issues };
}

function render(name, r) {
  const h = r.header;
  const countOk = h && r.count === h.count;
  const sumOk = h && h.total !== null && r.sum === h.total;
  const allOk = countOk && sumOk && r.issues.length === 0;

  const card = document.createElement('section');
  card.className = 'card';

  const row = (label, expected, got, ok, show) => `
    <tr><td>${label}</td>
      <td class="num">${expected}</td>
      <td class="num">${got}</td>
      <td class="num ${ok ? 'ok' : 'bad'}">${ok ? '✔ OK' : '✘ ' + show}</td></tr>`;

  const diffCents = h && h.total !== null ? r.sum - h.total : null;

  card.innerHTML = `
    <h2></h2>
    <div class="verdict ${allOk ? 'ok' : 'bad'}">${allOk ? '✔ El archivo es correcto' : '✘ El archivo tiene diferencias'}</div>
    <table>
      <thead><tr><th></th><th class="num">Encabezado</th><th class="num">Calculado</th><th class="num">Resultado</th></tr></thead>
      <tbody>
        ${row('Cantidad de débitos', h ? h.count : '—', r.count, countOk,
              h ? `dif. ${r.count - h.count > 0 ? '+' : ''}${r.count - h.count}` : 'sin encabezado')}
        ${row('Monto total', h && h.total !== null ? money(h.total) : '—', money(r.sum), sumOk,
              diffCents !== null ? `dif. ${diffCents > 0 ? '+' : '-'}${money(Math.abs(diffCents))}` : 'sin encabezado')}
      </tbody>
    </table>
    ${r.issues.length ? '<ul class="issues"></ul>' : ''}
    ${h ? `<div class="meta">Encabezado: id ${h.id} · fecha ${h.date}</div>` : ''}
  `;
  card.querySelector('h2').textContent = name;
  const ul = card.querySelector('ul.issues');
  if (ul) r.issues.forEach(t => { const li = document.createElement('li'); li.textContent = t; ul.appendChild(li); });
  return card;
}

async function handle(files) {
  const out = document.getElementById('results');
  out.innerHTML = '';
  for (const file of files) {
    const text = await file.text();
    out.appendChild(render(file.name, check(text)));
  }
  document.getElementById('actions').hidden = files.length === 0;
}

const drop = document.getElementById('drop');
const input = document.getElementById('file');
input.addEventListener('change', () => { handle(input.files); input.value = ''; });
['dragenter', 'dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', ev => handle(ev.dataTransfer.files));
document.getElementById('reset').addEventListener('click', () => {
  document.getElementById('results').innerHTML = '';
  document.getElementById('actions').hidden = true;
  input.value = '';
});
</script>
</body>
</html>
